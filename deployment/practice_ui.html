<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, Arial, sans-serif;
}

header {
    padding: 24px 6%;
    background: #111c30;
    border-bottom: 1px solid #334155;
}

h1 { margin: 0; color: #60a5fa; }
p { color: #94a3b8; }

main {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
}

.panel, .card {
    background: #1e293b;
    padding: 24px;
    border-radius: 14px;
    border: 1px solid #334155;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: 24px 0;
}

.value {
    font-size: 36px;
    color: #4ade80;
    margin-top: 12px;
}

select, button {
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    border: 0;
}

select {
    background: #334155;
    color: white;
    min-width: 180px;
}

button {
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover { background: #1d4ed8; }
button:disabled { opacity: 0.5; }

iframe {
    width: 100%;
    height: 450px;
    border: 0;
    border-radius: 12px;
}

pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

@media(max-width: 700px) {
    .cards { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
    <h1>PathSnap</h1>
    <p>Distributed Map-Matching and Route Reconstruction</p>
</header>

<main>

<div class="panel">
    <h2>Trip Selection</h2>
    <p>Practice demonstration — synthetic-trained model</p>

    <select id="trip"></select>

    <button id="run" onclick="predict()" disabled>
        Predict Route
    </button>

    <p id="status">Connecting to API...</p>
</div>

<div class="cards">
    <div class="card">
        GPS Observations
        <div class="value" id="gps">--</div>
    </div>

    <div class="card">
        Classifier Continuity
        <div class="value" id="baseline">--</div>
    </div>

    <div class="card">
        HMM Route Continuity
        <div class="value" id="hmm">--</div>
    </div>
</div>

<div class="panel">
    <h2>Route Visualisation</h2>
    <iframe id="map" title="Predicted route map"></iframe>
</div>

<br>

<div class="panel">
    <h2>Prediction Results</h2>
    <pre id="output">Select a trip to begin.</pre>
</div>

</main>

<script>
const api = window.location.origin;

async function loadTrips() {
    try {
        const response = await fetch(api + "/trips");
        if (!response.ok) throw new Error("API unavailable");

        const data = await response.json();

        data.trips.forEach(trip => {
            const option = document.createElement("option");
            option.value = trip;
            option.textContent = trip;
            document.getElementById("trip").appendChild(option);
        });

        document.getElementById("status").textContent =
            "API connected successfully";

        document.getElementById("run").disabled =
            data.trips.length === 0;

    } catch(error) {
        document.getElementById("status").textContent =
            error.message;
    }
}

async function predict() {
    const trip = document.getElementById("trip").value;
    const button = document.getElementById("run");

    button.disabled = true;

    document.getElementById("status").textContent =
        "Processing GPS trajectory...";

    try {
        const response = await fetch(
            api + "/predict/" + encodeURIComponent(trip)
        );

        if (!response.ok) throw new Error("Prediction failed");

        const data = await response.json();

        document.getElementById("gps").textContent =
            data.gps_observations;

        document.getElementById("baseline").textContent =
            (data.classifier_continuity * 100).toFixed(1) + "%";

        document.getElementById("hmm").textContent =
            (data.hmm_continuity * 100).toFixed(1) + "%";

        document.getElementById("output").textContent =
            JSON.stringify(data, null, 2);

        document.getElementById("map").src =
            api + "/map/" + encodeURIComponent(trip);

        document.getElementById("status").textContent =
            "Prediction completed successfully";

    } catch(error) {
        document.getElementById("status").textContent =
            error.message;
    } finally {
        button.disabled = false;
    }
}

loadTrips();
</script>

</body>
</html>
